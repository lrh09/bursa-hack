[project]
name = "bursahack"
version = "0.1.0"
description = "Bursa Malaysia historical backtest harness (strategy-agnostic, walk-forward, MPlus-fee-aware)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "numpy>=1.26",
    "matplotlib>=3.10.9",
    "reportlab>=4.5.1",
    "pymupdf>=1.27.2.3",
    "polars>=1.40",
    "duckdb>=1.5",
    "exchange_calendars>=4.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "vectorbt>=0.27,<1.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib", "seaborn"]
dev = ["pytest", "ruff"]
research = ["yfinance>=0.2"]  # free daily futures data for the diversification test

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
